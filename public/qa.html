<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Tests Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Outfit:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --success: #00e676;
            --fail: #ff5252;
            --warning: #ffb74d;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 1rem;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .badge {
            background: #333;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        button {
            background: #2d2d2d;
            color: white;
            border: 1px solid #444;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover {
            background: #3d3d3d;
        }

        button.primary {
            background: var(--success);
            color: #000;
            border: none;
        }

        button.primary:hover {
            filter: brightness(1.1);
        }

        .test-section {
            background: var(--surface);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            text-align: left;
            padding: 0.8rem;
            border-bottom: 1px solid #333;
        }

        th {
            color: #888;
            font-weight: normal;
            font-size: 0.9rem;
        }

        .status {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .pass {
            color: var(--success);
        }

        .fail {
            color: var(--fail);
        }

        .log {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85rem;
            color: #ccc;
        }

        #summary {
            display: flex;
            gap: 2rem;
            font-size: 1.1rem;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="dashboard">
        <header>
            <h1>QA Dashboard 🧪</h1>
            <span class="badge">v1.2.0</span>
        </header>

        <div class="controls">
            <button class="primary" onclick="runAllTests()">▶ Run All Tests</button>
            <button onclick="clearResults()">Clear</button>
        </div>

        <div id="summary">
            <span style="color: var(--success)">Passed: <span id="passCount">0</span></span>
            <span style="color: var(--fail)">Failed: <span id="failCount">0</span></span>
        </div>

        <!-- Backend Unit Tests -->
        <div class="test-section">
            <h2>Backend Unit Tests (PHP)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Test Case</th>
                        <th>Details</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="unitResults"></tbody>
            </table>
        </div>

        <!-- API Integration Tests -->
        <div class="test-section">
            <h2>API Integration Tests (HTTP)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Endpoint</th>
                        <th>Scenario</th>
                        <th>Expected Code</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="apiResults"></tbody>
            </table>
        </div>

    </div>

    <script>
        async function runAllTests() {
            clearResults();
            await runUnitTests();
            await runApiTests();
        }

        function clearResults() {
            document.getElementById('unitResults').innerHTML = '';
            document.getElementById('apiResults').innerHTML = '';
            document.getElementById('passCount').textContent = '0';
            document.getElementById('failCount').textContent = '0';
        }

        function updateStats(passed) {
            const id = passed ? 'passCount' : 'failCount';
            const el = document.getElementById(id);
            el.textContent = parseInt(el.textContent) + 1;
        }

        function addRow(tableId, col1, col2, passed, col3Text = null) {
            const tbody = document.getElementById(tableId);
            const tr = document.createElement('tr');

            const statusClass = passed ? 'pass' : 'fail';
            const statusText = passed ? 'PASS' : 'FAIL';
            const lastCol = col3Text ? `<td>${col3Text}</td><td class="status ${statusClass}">${statusText}</td>` : `<td class="status ${statusClass}">${statusText}</td>`;

            tr.innerHTML = `
                <td>${col1}</td>
                <td class="log">${col2}</td>
                ${col3Text ? `<td>${col3Text}</td>` : ''} 
                <td class="status ${statusClass}">${statusText}</td>
            `;
            tbody.appendChild(tr);
            updateStats(passed);
        }

        async function runUnitTests() {
            try {
                const response = await fetch('../api/test_runner.php');
                const data = await response.json(); // Array of results {name, passed, details}

                // Inspect the structure returned by PHP script
                // Assuming format: { results: [...] } based on previous step
                const tests = data.results || [];

                tests.forEach(test => {
                    const detailsStr = test.details && Object.keys(test.details).length ? JSON.stringify(test.details) : '-';
                    addRow('unitResults', test.name, detailsStr, test.passed);
                });

            } catch (e) {
                console.error(e);
                addRow('unitResults', 'Runner Error', e.message, false);
            }
        }

        async function runApiTests() {
            const apiEndpoint = '../api/login.php';

            // Test 1: Valid Login
            await testApiCall(apiEndpoint, { username: 'admin', password: 'password123' }, 200, 'Login Success (200)');

            // Test 2: Invalid Password
            await testApiCall(apiEndpoint, { username: 'admin', password: 'wrong' }, 401, 'Block Bad Pass (401)');

            // Test 3: Missing Fields
            await testApiCall(apiEndpoint, { username: '' }, 400, 'Block Missing Fields (400)');

            // Test 4: SQL/NoSQL Injection Check (Basic) - Should not crash (500)
            await testApiCall(apiEndpoint, { username: '{"$gt": ""}', password: '123' }, 401, 'Injection Attempt (401/200)');
        }

        async function testApiCall(url, payload, expectedStatus, testName) {
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const passed = res.status === expectedStatus;
                const body = await res.text();
                let output = `Status: ${res.status}`;

                // Try to parse error message if failed
                if (!passed) {
                    output += ` (Expected ${expectedStatus})`;
                    try { output += ` | Msg: ${JSON.parse(body).message}`; } catch (e) { }
                }

                addRow('apiResults', 'POST /api/login.php', output, passed, testName);

            } catch (e) {
                addRow('apiResults', 'POST /api/login.php', `Network Error: ${e.message}`, false, testName);
            }
        }
    </script>
</body>

</html>
